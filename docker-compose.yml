# Local stand-in for the staging database until the real connection URL
# is provided. Same pattern as the IMDb Docker/Postgres example — spin up
# Postgres, load a schema, verify with a few queries.
version: "3.8"
services:
  postgres:
    image: postgres:15
    container_name: verifier-dashboard-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: verifier_dashboard
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
